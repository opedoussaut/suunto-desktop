[package]
name = "suunto-desktop"
version = "0.1.0"
description = "A desktop route and map companion for Suunto users"
authors = ["Olivier Pedoussaut"]
edition = "2021"

[lib]
name = "suunto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
