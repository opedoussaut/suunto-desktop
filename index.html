<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <title>suunto-desktop</title>
    <style>
      html, body { margin: 0; min-width: 320px; min-height: 100%; background: #0b0d10; color: #f4f6f8; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .boot-fallback { min-height: 100vh; display: grid; place-items: center; padding: 32px; box-sizing: border-box; }
      .boot-fallback > div { max-width: 520px; }
      .boot-fallback strong { display: block; font-size: 20px; margin-bottom: 8px; }
      .boot-fallback span { color: #8e96a1; font-size: 13px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <div>
          <strong>Starting suunto-desktop…</strong>
          <span>If this message does not disappear, the frontend failed to load. Open F12 → Console and share the first red error.</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
